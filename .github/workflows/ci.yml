name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        node-version: [22, 24, 26]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm run build
      # tests need a local Claude Code binary; not run in CI

  # Publishes via npm Trusted Publishing (OIDC): no NPM_TOKEN secret. The npm
  # package must list this repo, workflow file ci.yml and environment
  # npm-release as its trusted publisher. Requires npm >= 11.5.1.
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Release tag must point at a commit on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # No dependency install scripts run while the job can mint a publish credential.
      - run: npm install -g npm@11.21.2 --ignore-scripts
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm publish --access public --provenance --ignore-scripts
